name: Verify Zenodo archive metadata
on:
  push:
    branches: [release-v2-transfer]
    paths: [.github/workflows/check-zenodo-v2.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2f88c9b24839f3402414836a1e8f3611c01379c
          persist-credentials: false
      - name: Verify archived Zenodo bytes against the released Git tree
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, subprocess, urllib.request, urllib.parse, zipfile
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'ClaimScope archive verification'}), timeout=60) as r:
                  return r.read()
          record = json.loads(get('https://zenodo.org/api/records/24547363'))
          assert record['doi']=='10.5281/zenodo.24547363'
          assert record['metadata']['version']=='2.0.0'
          assert record['conceptdoi']=='10.5281/zenodo.24434116'
          assert len(record['files'])==1
          f=record['files'][0]
          url=f.get('links',{}).get('self') or 'https://zenodo.org/records/24547363/files/'+urllib.parse.quote(f['key'],safe='')+'?download=1'
          raw=get(url)
          assert len(raw)==f['size']==1143143
          assert 'md5:'+hashlib.md5(raw).hexdigest()==f['checksum']=='md5:1c06e8be68dca9cc1e3dfc86e9537c8d'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              files=[n for n in z.namelist() if not n.endswith('/')]
              assert len(files)==64
              roots={n.split('/',1)[0] for n in files}
              assert len(roots)==1
              mapped={n.split('/',1)[1]:n for n in files}
              tracked=subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0')
              assert set(mapped)==set(tracked)
              for p,n in mapped.items():
                  assert z.read(n)==subprocess.check_output(['git','show','HEAD:'+p]),p
              print(json.dumps({'doi':record['doi'],'version':record['metadata']['version'],'archive_md5':hashlib.md5(raw).hexdigest(),'archive_sha256':hashlib.sha256(raw).hexdigest(),'files_identical_to_release':len(mapped),'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()}))
          PY
