name: Collect Rspack temporal metadata once
on:
  push:
    branches:
      - audit/rspack97-temporal-metadata-20261122
    paths:
      - '.github/workflows/temporary-rspack97-temporal.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect all 97 PR issue-comment metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 code/audit_rspack97_temporal.py --collect
      - name: Independently replay timestamp ledger offline
        run: |
          sha256sum evidence/rspack97_issue_comment_timestamps_20261122.csv results/rspack97_temporal_provenance_20261122.json > before.sha256
          python3 code/audit_rspack97_temporal.py --offline
          sha256sum evidence/rspack97_issue_comment_timestamps_20261122.csv results/rspack97_temporal_provenance_20261122.json > after.sha256
          diff -u before.sha256 after.sha256
          python3 - <<'PY'
          from pathlib import Path
          s=Path('evidence/rspack97_issue_comment_timestamps_20261122.csv').read_text()
          assert len(s.splitlines())==477
          assert 'github.com' not in s and '@' not in s
          assert 'body' not in s and 'login' not in s
          print("PASS: 476 public comment timestamps, no comment bodies or accounts")
          PY
      - name: Freeze two verified outputs on this temporary audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/rspack97_issue_comment_timestamps_20261122.csv results/rspack97_temporal_provenance_20261122.json
          git commit -m "Freeze 476 public comment timestamps from the 97 PRs"
          git push origin HEAD:audit/rspack97-temporal-metadata-20261122
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspack97-temporal-provenance
          path: |
            evidence/rspack97_issue_comment_timestamps_20261122.csv
            results/rspack97_temporal_provenance_20261122.json
          retention-days: 30
