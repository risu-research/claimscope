name: ONE TIME - freeze public Rspack boundary excerpts
on:
  push:
    branches:
      - release/claimscope-v1-audit-20261122
    paths:
      - '.github/workflows/temporary-collect-boundary.yml'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build minimal 72-pair source excerpts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 code/replay_rspack65_boundary_witnesses.py --collect
          python3 code/replay_rspack65_boundary_witnesses.py --offline
      - name: Check public fixture size and private text patterns
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('evidence/rspack65_boundary_witnesses_20261122.json')
          blob=p.read_bytes()
          x=json.loads(blob)
          assert len(x['witnesses'])==72
          assert len(blob)<220000
          snippets='\n'.join(w['left_public_bot_tail']+'\n'+w['right_public_bot_head'] for w in x['witnesses'])
          assert not re.search(r'(?i)(?:github_pat_[a-z0-9_]{15,}|ghp_[a-z0-9]{30,}|-----BEGIN .*PRIVATE KEY|[a-z]:\\users\\)',snippets)
          print(f'PASS: {len(x["witnesses"])} minimal bot-only public witnesses; {len(blob)} bytes')
          PY
      - name: Commit frozen data to this preparation branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/rspack65_boundary_witnesses_20261122.json
          git commit -m "Freeze 72 source-linked minimal public boundary witnesses"
          git fetch origin release/claimscope-v1-audit-20261122
          git rebase origin/release/claimscope-v1-audit-20261122
          git push origin HEAD:release/claimscope-v1-audit-20261122
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspack65-boundary-witnesses
          path: evidence/rspack65_boundary_witnesses_20261122.json
          retention-days: 14
