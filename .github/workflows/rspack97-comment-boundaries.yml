name: Audit comment boundaries across Rspack 97
on:
  push:
    paths:
      - '.github/workflows/rspack97-comment-boundaries.yml'
      - 'code/audit_rspack_97_comment_boundaries.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay exact D6 rules on all 97 public issue threads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python code/audit_rspack_97_comment_boundaries.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspack97-comment-boundary-results
          path: |
            results/rspack_97_comment_boundary_audit.json
            results/rspack_97_comment_boundary_audit.csv
          retention-days: 30
